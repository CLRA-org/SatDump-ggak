name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Update apt cache (with retries for transient repository errors)
        run: |
          sudo apt-get update || (sleep 15 && sudo apt-get update) || (sleep 30 && sudo apt-get update)

      - name: Install dependencies
        run: |
          sudo apt-get install -y git build-essential cmake g++ pkgconf libfftw3-dev libpng-dev \
            libtiff-dev libjemalloc-dev libcurl4-openssl-dev libvolk-dev libnng-dev \
            libglfw3-dev zenity portaudio19-dev libzstd-dev libhdf5-dev librtlsdr-dev \
            libhackrf-dev libairspy-dev libairspyhf-dev libad9361-dev libiio-dev \
            libbladerf-dev libomp-dev ocl-icd-opencl-dev libdbus-1-dev libarmadillo-dev \
            libsqlite3-dev liblimesuite-dev libuhd-dev libxrandr-dev gettext python3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=ON -DENABLE_I18N=ON -DPLUGINS_ALL=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Package install tree and DEB
        run: |
          staging="$RUNNER_TEMP/satdump-linux"
          cmake --install build --config Release --prefix "$staging/usr" > /tmp/install.log 2>&1 || { tail -50 /tmp/install.log; exit 1; }
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf dist/SatDump-Linux-x64-install-tree.tar.gz satdump-linux
          cmake --build build --target package -j$(nproc)
          find build -maxdepth 1 -type f -name '*.deb' -exec cp {} dist/ \;
          test -n "$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.tar.gz' \) -print -quit)"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: satdump-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg dependencies
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg
          key: satdump-windows-x64-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install mako
        run: pip install mako

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg with SDR dependencies
        shell: pwsh
        run: .\windows\Configure-vcpkg.ps1 -platform x64-windows

      - name: Save vcpkg dependencies
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg
          key: satdump-windows-x64-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Configure CMake
        run: >
          cmake -B build
          -DBUILD_MSVC=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -A x64
          -DBUILD_GUI=ON
          -DENABLE_I18N=ON
          -DPLUGINS_ALL=OFF
          -DPLUGIN_ELEKTRO_ARKTIKA=ON
          -DPLUGIN_AARONIA_SDR_SUPPORT=OFF
          -DPLUGIN_SDRPLAY_SDR_SUPPORT=OFF
          -DPLUGIN_BLADERF_SDR_SUPPORT=OFF
          -DPLUGIN_SDDC_SDR_SUPPORT=OFF
          -DPLUGIN_INMARSAT=OFF
          -DPLUGIN_FIRSTPARTY_SUPPORT=OFF
          -DPLUGIN_PROBA=OFF
          -DPLUGIN_HAROGIC_SDR_SUPPORT=OFF
          -DPLUGIN_LITEXM2SDR_SDR_SUPPORT=OFF
          -DPLUGIN_RTAUDIO_SDR_SUPPORT=OFF
          -DPLUGIN_SOAPY_SDR_SUPPORT=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows release
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "satdump-windows"
          cmake --install build --config Release --prefix $staging
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$staging\*" -DestinationPath dist\SatDump-Windows-x64-portable.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: satdump-windows
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK / NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;30.0.3 ndk;25.2.9519653'

      - name: Install Gradle 7.6.4 (no wrapper in this repo)
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle"
          echo "PATH=$RUNNER_TEMP/gradle/gradle-7.6.4/bin:$PATH" >> "$GITHUB_ENV"

      - name: Configure SDK location
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build native dependencies (android/deps)
        run: |
          git submodule update --init --recursive android/deps
          sudo apt-get install -y python3 python3-pip
          pip3 install mako
          # The upstream deps script clones R1NC/sqlite which no longer exists.
          # Provide the sqlite3 amalgamation with a small CMake wrapper instead.
          mkdir -p android/deps/sqlite
          curl -fsSL https://www.sqlite.org/2023/sqlite-amalgamation-3430000.zip -o /tmp/sqlite.zip
          python3 -m zipfile -e /tmp/sqlite.zip android/deps/sqlite
          mv android/deps/sqlite/sqlite-amalgamation-3430000/* android/deps/sqlite/
          rmdir android/deps/sqlite/sqlite-amalgamation-3430000
          cat > android/deps/sqlite/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(sqlite3 C)
          add_library(sqlite3 STATIC sqlite3.c)
          target_include_directories(sqlite3 PUBLIC ${CMAKE_CURRENT_SOURCE_DIR})
          install(TARGETS sqlite3 ARCHIVE DESTINATION lib)
          install(FILES sqlite3.h sqlite3ext.h DESTINATION include)
          EOF
          cd android/deps
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          sh build.sh
          for f in libvolk.a libsqlite3.a libfftw3f.a libz.a libpng.a libzstd.a libtiff.a libcurl.a libnng.a libwolfssl.a libcpu_features.a; do
            test -f output/arm64-v8a/lib/$f || { echo "FATAL: android/deps build did not produce $f"; ls output/arm64-v8a/lib/; exit 1; }
          done

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: satdump-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
